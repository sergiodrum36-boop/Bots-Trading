name: Ciclo diario de paper trading

# Ejecuta UN ciclo de scripts/run_paper_trading.py, independientemente de
# si el portatil del usuario esta encendido o no (ver core/bot_engine.py
# para por que el bot esta pensado como "un ciclo, se invoca desde fuera"
# en vez de un proceso continuo).
#
# Requiere Secrets configurados en este repositorio (Settings -> Secrets
# and variables -> Actions), nunca escritos aqui ni en ningun otro archivo:
#   - APCA_API_KEY_ID / APCA_API_SECRET_KEY: claves de PAPER TRADING de
#     Alpaca (nunca las de cuenta real).
#   - TRADING_BOT_DATABASE_URL: connection string de Postgres/Supabase
#     (usa el "Transaction pooler", puerto 6543 -- pensado para conexiones
#     cortas como esta, no el connection string "directo"). Sin esto, cada
#     ejecucion perderia el estado del kill switch y el historial al
#     terminar el runner -- ver persistence/kill_switch_store.py.
#   - TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID (OPCIONAL): si se configuran,
#     este ciclo tambien avisa por Telegram cuando el kill switch se activa,
#     el ciclo se aborta por un fallo de conexion, o algun simbolo tiene un
#     error -- ver notifications/notifier.py. Sin ellos, el comportamiento
#     es identico a antes (no bloqueante). Deliberadamente NO se pasa
#     --notify-summary aqui (decision del usuario, 2026-08-16): solo avisos
#     criticos, sin un mensaje diario de puro tramite.

on:
  schedule:
    # 15:00 UTC, lunes a viernes -- cae dentro del horario de mercado de
    # NYSE/NASDAQ (9:30-16:00 hora de Nueva York) durante todo el ano,
    # incluso en las semanas en que EE. UU. y la UE cambian de hora en
    # fechas distintas. El propio ciclo comprueba is_market_open() y no
    # hace nada si el mercado esta cerrado ese dia (fin de semana,
    # festivo) -- ver core/bot_engine.py.
    - cron: "0 15 * * 1-5"
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestana Actions, para probar

concurrency:
  group: ciclo-diario-paper-trading
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ciclo-diario:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar el ciclo de paper trading
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          TRADING_BOT_DATABASE_URL: ${{ secrets.TRADING_BOT_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_paper_trading.py --verbose
